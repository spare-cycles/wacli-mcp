name: build-image

# Build and push the wa-mcp container image to GHCR.
# Tags: a semver tag push (v1.2.3) -> :1.2.3 + :latest; any main push -> :main + :sha-<short>.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The same gate `ci.yml` runs, restated here rather than reached for with `workflow_call`.
  # It exists so `needs: check` below can gate publication: a workflow cannot depend on a job in
  # another workflow, and nothing else stops a red tree from being tagged `:latest`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # ffmpeg for the conversion tests, poppler-utils for `pdftotext` — the suite exercises both
      # for real rather than stubbing them, so a runner without either goes red on 2 tests that
      # pass on any developer machine that happens to have them. The image installs both too.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: pnpm test

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the whisper.cpp image the Dockerfile copies from publishes no other arch.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
